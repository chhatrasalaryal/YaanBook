<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My booking – YaanBook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/">Yaan<span>Book</span></a>
      <nav class="links">
        <a href="/">Search</a>
        <a href="/#deals">Empty-leg deals</a>
        <a href="/booking.html" class="active">My booking</a>
        <a href="/operator.html">For operators</a>
      </nav>
    </div>
  </header>
  <main class="wrap page" style="max-width:820px">
    <h1>Track your booking</h1>
    <form id="lookup" class="card panel inline-form">
      <label class="f">Booking reference<input name="ref" required placeholder="YBXXXXXXXX"></label>
      <label class="f">Email<input name="email" type="email" required></label>
      <button class="btn">Find booking</button>
    </form>
    <div id="error" class="alert error hidden"></div>
    <div id="out"></div>
  </main>
  <script src="common.js"></script>
  <script>
    const STATUS_TEXT = {
      requested: 'Waiting for the operator to confirm availability. Your price is locked.',
      confirmed: 'Confirmed. We will send the payment link and flight details to your email.',
      rejected: 'The operator could not take this trip. Search again: other aircraft may be available.',
      cancelled: 'This booking was cancelled.',
    };
    async function lookup(ref, email) {
      $('#error').classList.add('hidden');
      try {
        const b = await api(`/bookings/${encodeURIComponent(ref)}?email=${encodeURIComponent(email)}`);
        const q = b.quote;
        $('#out').innerHTML = `
          <div class="card panel">
            <div class="result-head">
              <div><h2>${esc(b.ref)}</h2><div class="status ${b.status}">${b.status}</div></div>
              <div class="price"><div class="total" style="font-size:1.4rem;font-weight:800">${inr(b.total)}</div><div class="meta">incl. GST</div></div>
            </div>
            <div class="alert ${b.status === 'confirmed' ? 'ok' : b.status === 'rejected' ? 'error' : 'info'}">${STATUS_TEXT[b.status]}
              ${b.operatorNote ? `<br><b>Operator note:</b> ${esc(b.operatorNote)}` : ''}</div>
            <p><b>${esc(b.aircraft.model)}</b> (${esc(b.aircraft.registration)}) · ${esc(b.aircraft.operator.name)} · NSOP ${esc(b.aircraft.operator.nsopPermit)}</p>
            <table><thead><tr><th>Date</th><th>Flight</th></tr></thead><tbody>
              ${b.legs.map((l) => `<tr><td>${fmtDate(l.date)}</td><td>${esc(locLabel(l.fromLocation))} → ${esc(locLabel(l.toLocation))}</td></tr>`).join('')}
            </tbody></table>
            <h3 style="margin-top:16px;font-size:1rem">Price breakdown</h3>
            <table><tbody>
              ${q.lines.map((l) => `<tr><td>${esc(l.label)}</td><td class="num">${inr(l.amount)}</td></tr>`).join('')}
              ${q.platformFee ? `<tr><td>Platform fee</td><td class="num">${inr(q.platformFee)}</td></tr>` : ''}
              <tr><td>GST</td><td class="num">${inr(q.gst)}</td></tr>
              <tr class="total"><td>Total</td><td class="num">${inr(q.total)}</td></tr>
            </tbody></table>
            <p class="meta">${b.pax} passenger(s) · requested ${esc(b.createdAt)} UTC</p>
          </div>`;
      } catch (e) {
        $('#out').innerHTML = '';
        $('#error').textContent = e.message;
        $('#error').classList.remove('hidden');
      }
    }
    $('#lookup').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      lookup(f.get('ref').trim(), f.get('email').trim());
    });
    const p = new URLSearchParams(location.search);
    if (p.get('ref') && p.get('email')) {
      $('#lookup').ref.value = p.get('ref');
      $('#lookup').email.value = p.get('email');
      lookup(p.get('ref'), p.get('email'));
    }
  </script>
</body>
</html>
